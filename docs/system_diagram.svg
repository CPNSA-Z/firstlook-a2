<text x="175.0" y="192.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">stored, or uploaded on the search page</text>
<rect x="45" y="224" width="260" height="74" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="175.0" y="257.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Five fold models</text>
<text x="175.0" y="274.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">3D CNN + FiLM</text>
<rect x="45" y="330" width="260" height="74" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="175.0" y="355.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Inference service (FastAPI)</text>
<text x="175.0" y="372.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">held-out fold or five-model mean</text>
<text x="175.0" y="389.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">exact SHAP · Grad-CAM</text>
<rect x="45" y="500" width="260" height="58" rx="9" fill="#e4dfec" stroke="#7030a0" stroke-width="2" stroke-dasharray=""/>
<text x="175.0" y="525.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Local LLM (LM Studio)</text>
<text x="175.0" y="542.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">any OpenAI-compatible model</text>
<rect x="430" y="110" width="260" height="74" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="560.0" y="135.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Input checks (rules)</text>
<text x="560.0" y="152.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">record only: missing / assumed inputs,</text>
<text x="560.0" y="169.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">range, GDS, failed scan</text>
<rect x="430" y="300" width="260" height="58" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="560.0" y="325.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Uncertainty checks (rules)</text>
<text x="560.0" y="342.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">scores only: fold spread, near 0.5</text>
<rect x="430" y="450" width="260" height="74" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="560.0" y="475.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Validators</text>
<text x="560.0" y="492.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">explanation: input, sign, size, numbers,</text>
<text x="560.0" y="509.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">no diagnosis · no false input/scan claims</text>
<rect x="430" y="610" width="260" height="74" rx="9" fill="#fce4d6" stroke="#c55a11" stroke-width="2" stroke-dasharray=""/>
<text x="560.0" y="635.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Assistant context gate</text>
<text x="560.0" y="652.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">before Step 2: record only</text>
<text x="560.0" y="669.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">after Step 2: + model numbers</text>
<rect x="830" y="40" width="260" height="50" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="70.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Search: image ID (+ optional scan)</text>
<rect x="830" y="120" width="260" height="50" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="150.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1  Record, own MRI, input alerts</text>
<rect x="830" y="200" width="260" height="62" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="227.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2  Own read, or name the</text>
<text x="960.0" y="244.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">uncertainty → View AI</text>
<rect x="830" y="300" width="260" height="62" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="327.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3  AI analysis: agree → folded;</text>
<text x="960.0" y="344.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">differ / unsure → opened</text>
<rect x="830" y="412" width="260" height="62" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="439.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4  Lower / Uncertain-refer / Higher</text>
<text x="960.0" y="456.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">(reason if the first read changes)</text>
<rect x="830" y="520" width="260" height="50" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="550.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Decision log (JSONL)</text>
<rect x="830" y="610" width="260" height="62" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="637.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Condition A baseline</text>
<text x="960.0" y="654.5" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">verdict + SHAP + map first</text>
<rect x="830" y="720" width="260" height="50" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
