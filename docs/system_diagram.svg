<text x="175.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Patient database (SQLite)</text>
<text x="175.0" y="102.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">from the ADNI export</text>
<text x="175.0" y="119.0" font-size="12.3" text-anchor="middle" font-weight="normal" fill="#111">no diagnosis group stored</text>
<rect x="45" y="150" width="260" height="58" rx="9" fill="#e2f0d9" stroke="#3a7d2c" stroke-width="2" stroke-dasharray=""/>
